<script>
        // Micro-interaction logic for toggles and notes
        function setAttendance(button, status) {
            const container = button.parentElement;
            const buttons = container.querySelectorAll('button');
            
            // Reset both buttons
            buttons[0].className = "toggle-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-center text-on-surface-variant";
            buttons[1].className = "toggle-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-center text-on-surface-variant";
            
            // Set active state
            if(status === 'present') {
                buttons[0].className = "toggle-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-center bg-primary text-on-primary shadow-sm";
            } else {
                buttons[1].className = "toggle-btn flex-1 py-2 rounded-lg font-label-md text-label-md text-center bg-surface-variant text-on-surface shadow-sm";
            }
        }

        function toggleNote(button) {
            const card = button.closest('.member-card');
            const noteContainer = card.querySelector('.note-input-container');
            
            if (noteContainer.classList.contains('open')) {
                noteContainer.classList.remove('open');
                button.classList.remove('text-primary');
                button.classList.add('text-outline');
            } else {
                noteContainer.classList.add('open');
                button.classList.add('text-primary');
                button.classList.remove('text-outline');
                // Optional: focus input when opened
                setTimeout(() => {
                    noteContainer.querySelector('input').focus();
                }, 100);
            }
        }
    </script>
